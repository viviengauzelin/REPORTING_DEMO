[mypy]
# Cible d'analyse alignée sur l'interpréteur de développement. Note : on ne peut pas
# viser une version < 3.12 ici, car les stubs de numpy >= 2.x emploient une syntaxe de
# typage réservée à 3.12+. Le support runtime « 3.10+ » (README) reste valable : il
# porte sur l'exécution du code, pas sur la version supposée par l'analyse statique.
python_version = 3.12
files = app.py, config.py, generate_demo_data.py, main.py, utils.py, workbook.py, test_utils.py
disallow_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
show_error_codes = True

# pandas : non typé volontairement. pandas-stubs génère trop de faux positifs sur
# l'accès aux cellules (df.loc[...], iterrows, groupby) pour ce type de code.
# mypy continue de vérifier 100 % de NOTRE code ; seul l'intérieur de pandas est ignoré.
# -> désinstaller le paquet : pip uninstall pandas-stubs
[mypy-pandas.*]
ignore_missing_imports = True

# numpy : importé directement (générateur + tests). On ignore son intérieur comme
# pour pandas ; seul NOTRE code est vérifié.
[mypy-numpy.*]
ignore_missing_imports = True

# Bibliothèques tierces sans stubs de types
[mypy-streamlit.*]
ignore_missing_imports = True
[mypy-matplotlib.*]
ignore_missing_imports = True
[mypy-openpyxl.*]
ignore_missing_imports = True
[mypy-dotenv.*]
ignore_missing_imports = True

# pytest : outil de test sans stubs
[mypy-pytest.*]
ignore_missing_imports = True

# Tests : on vérifie les types DANS les tests, mais on n'exige pas l'annotation
# de chaque fonction/fixture (convention courante : les tests sont plus souples).
[mypy-test_utils]
disallow_untyped_defs = False